[package]
name = "disktree-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Filesystem scanning and treemap layout for disktree"

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rayon = { workspace = true }
rustix = { version = "1.1", features = ["fs"] }
rustc-hash = { workspace = true }

[dev-dependencies]
tempfile = "3"

# The system trash, through NSFileManager: what Finder's Move to Trash does,
# without asking to control Finder. Only this backend is used; the crate's
# Linux and Windows code is not built.
[target.'cfg(target_os = "macos")'.dependencies]
trash = { version = "5.2.9", default-features = false }
