name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests run here, so the token can read and nothing more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # What GPUI links against: windowing (Wayland, X11), input, fonts,
      # and the Vulkan loader.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libasound2-dev libssl-dev libzstd-dev

      # Pinned: the lint gate denies clippy::all and ::pedantic, and a newer
      # clippy's new lints are a change to make on purpose, not by surprise.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo xtask lint

      - name: Test
        run: cargo xtask test

  check-macos:
    name: Lint and test (macOS)
    # Apple silicon. No system libraries to install, and no Metal toolchain
    # either: gpui-kit builds GPUI with runtime shader compilation, so the
    # shaders compile when the app starts, not here.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo xtask lint

      - name: Test
        run: cargo xtask test

      # The app bundle, signed ad hoc: catches a broken Info.plist, icon or
      # signature before a release does.
      - name: Bundle
        run: cargo xtask bundle

  windows:
    name: Lint and test (Windows)
    runs-on: windows-2025
    steps:
      # Check out with the repository's own line endings, as on Linux.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      # Pinned with the Linux job, for the same reason. GPUI needs nothing
      # beyond the Windows SDK the runner already has.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo xtask lint

      - name: Test
        run: cargo xtask test
